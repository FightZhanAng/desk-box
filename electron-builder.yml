appId: com.tomcato.desk-box
productName: 桌面收纳盒
copyright: Copyright © 2026 tomcato

# 应用内更新的源头。electron-builder 会把这段写进包里的 app-update.yml，
# electron-updater 启动后照着它去 GitHub Release 拉 latest.yml 比对版本。
# 真正的上传由 CI（.github/workflows/release.yml）负责，本地 dist 固定 --publish never。
publish:
  provider: github
  owner: FightZhanAng
  repo: desk-box

directories:
  buildResources: resources
  output: release

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources
    to: assets
    filter:
      - '**/*'

win:
  # 用自己生成的多尺寸 .ico，不要给 png 让它去转 ——
  # electron-builder 内置的 WASM 图标工具在内存受限环境下会直接崩掉打包流程
  icon: resources/icon.ico
  # 可执行文件名保持 ASCII：产品名带中文时，中文 exe 名在部分工具链上会出问题
  executableName: desk-box
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 桌面收纳盒
  artifactName: desk-box-${version}-setup.${ext}

portable:
  artifactName: desk-box-${version}-portable.${ext}

mac:
  # 未签名：没有 Apple Developer ID。identity: null 是文档明示的「跳过签名」开关
  identity: null
  icon: resources/icon.icns
  category: public.app-category.productivity
  artifactName: desk-box-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
