name: Release

# 推 v* 标签时打包并发布 Release（应用内更新读的就是这个 Release 里的 latest.yml）；
# 也支持在 Actions 页面手动跑一次，只留档不发版。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# gh release create 需要写权限
permissions:
  contents: write

env:
  # runner 能直连 GitHub，不要用 scripts/dist.mjs 里默认的 npmmirror（那里是给国内机器用的）
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 必须放在 setup-node 之前 —— 后面的 cache: pnpm 依赖它
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      # package.json 的 dist 脚本里已经带了 --publish never。
      # 少了它，electron-builder 在 CI + tag 环境下会「隐式发布」，
      # 抢在 gh release 之前失败，把整个打包步骤带崩。
      - name: 打包
        run: pnpm dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            release/*-setup.exe
            release/*-portable.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # latest.yml 和 blockmap 都不能少：应用内的更新检查先去 Release 拉清单
      # 才知道有没有新版本，blockmap 是差分下载用的（少了就只能整包重下）。
      - name: 发布 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*-setup.exe dist/*-portable.exe dist/latest.yml dist/*.blockmap \
            --repo "${{ github.repository }}" \
            --generate-notes
